name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/analyze_results.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
